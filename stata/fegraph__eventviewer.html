<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
<title>fegraph · mover wage profiles</title>
<style>
:root{color-scheme:light;--bg:#fafbfd;--surface:#fff;--ink:#17223a;--muted:#5c6a86;--line:#d8dfea;--accent:#3d5fd0;--term:#f1f4f9}
:root[data-theme=dark]{color-scheme:dark;--bg:#101116;--surface:#13131a;--ink:#e6ecf7;--muted:#9aabc8;--line:#28354b;--accent:#8cacf9;--term:#0f1a2d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}main{max-width:1200px;margin:auto;padding:32px 28px}header{display:flex;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.12em}h1{font:normal 32px Georgia,serif;margin:8px 0}#subtitle,#note{color:var(--muted);line-height:1.8}button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--surface)}.transport,.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0}label{display:inline-flex;align-items:center;gap:6px}input{accent-color:var(--accent)}#timeline{flex:1;min-width:120px}.meta{display:flex;gap:18px;justify-content:space-between;padding:12px 0;border-block:1px solid var(--line);color:var(--muted)}#charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;padding:12px 8px 6px}.panel h2{font:normal 19px Georgia,serif;margin:0 12px 8px}.panel canvas{display:block;width:100%;height:285px;touch-action:pan-y}#charts.overlay{grid-template-columns:1fr}#charts.overlay canvas{height:440px}#destinations,#legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px}#destinations{padding:6px 0 16px}.dot{width:10px;height:10px;display:inline-block;border-radius:50%}#legend{padding:14px 0;color:var(--muted)}#note,#details,#status,#empty{font-size:11px}#details{padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--term);line-height:1.8;white-space:pre-line;min-height:58px}#status,#empty{color:var(--muted);line-height:1.7;padding:8px 0}#provenance{padding:12px 15px;background:var(--term);border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px;line-height:1.8}[hidden]{display:none!important}@media(max-width:700px){main{padding:20px 12px}header{flex-direction:column}h1{font-size:28px}#charts{grid-template-columns:1fr}.panel canvas{height:270px}.meta{font-size:11px;flex-direction:column;gap:6px}#charts.overlay canvas{height:340px}}
</style>
</head><body><main>
<header><div><div class="eyebrow">FEGRAPH · LINKED WORKER–FIRM DATA</div><h1 id="title"></h1><p id="subtitle"></p></div><label>Theme <select id="theme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></header>
<div class="meta"><span id="mode"></span><span id="counts"></span></div>
<div class="transport"><button id="play" class="primary">Pause</button><button id="restart">Restart</button><button id="prev" aria-label="Previous frame">←</button><input id="timeline" aria-label="Playback position" type="range" min="0" step="1" value="0"><button id="next" aria-label="Next frame">→</button><span id="period" aria-live="polite"></span><label>Speed <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div>
<div class="filters"><label>Origin <select id="origin"><option value="all">All selected groups</option></select></label><label>Display <select id="layout"><option value="panels">Origin panels</option><option value="overlay">Overlay</option></select></label><label id="ci-control"><input id="ci" type="checkbox">Confidence intervals</label><button id="reset">Reset selection</button></div>
<div id="destinations" aria-label="Destination groups"></div>
<div id="status">Loading profiles… If this message remains, download the HTML and open it in a full browser with JavaScript enabled.</div><div id="empty" hidden></div>
<div id="charts"></div><div id="legend"></div><div id="details" aria-live="polite">Hover or tap a point for its mean, event count and worker count.</div><p id="note"></p><div id="provenance"></div>
<noscript>This standalone file needs JavaScript to display the profiles. It makes no network requests.</noscript>
</main>
<!-- FEGRAPH_DATA -->
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);let failed=false;
function error(e){failed=true;$('status').hidden=false;$('status').textContent='Profiles could not be displayed: '+(e.message||String(e))+'. Download the HTML and open it in a full browser.';$('status').setAttribute('role','alert');$('play').disabled=true;}
window.addEventListener('error',e=>error(e.error||e.message));
try {
const payload=$('fegraph-data');if(!payload)throw Error('This is a viewer template without exported data');
const D=JSON.parse(payload.textContent), timeMode=D.mode==='time', media=matchMedia('(prefers-color-scheme: dark)'), reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const frames=timeMode?D.cohorts:Array.from({length:D.post-D.pre+1},(_,i)=>D.pre+i), fmt=x=>x==null?'unavailable':Number(x).toLocaleString(undefined,{maximumFractionDigits:4});
const palette=D.palette.map(c=>'rgb('+c.trim().split(/\s+/).join(',')+')');
const color=d=>palette[D.destinations.length===1?3:Math.round(6*D.destinations.indexOf(d)/(D.destinations.length-1))];
const patterns=[[],[8,4],[2,4],[8,3,2,3],[14,5],[4,3]];
let index=0,paused=reduced,speed=+D.speed,last=null,elapsed=0,selected=new Set(D.destinations),panels=[];
function text(id,t){$(id).textContent=t;$(id).hidden=!t;}
text('title',D.title);text('subtitle',D.subtitle);text('note',D.note);document.title=(D.title||'Mover profiles')+' · fegraph';
text('mode',timeMode?'Arrival-cohort playback':'Pooled profiles · event-time playback');
text('provenance',D.command?'Stata → fegraph type(eventstudy) → standalone HTML. Statistics are calculated in Stata; this page displays exported group means. No individual records or external resources are embedded.':'');
$('theme').value=D.theme;$('layout').value=D.overlay?'overlay':'panels';$('ci').checked=!!D.ci;
$('ci-control').title='Pointwise intervals clustered by worker; conditional on supplied groups. They exclude uncertainty in estimated ranking scores.';
$('timeline').max=frames.length-1;$('timeline').setAttribute('aria-label',timeMode?'Arrival cohort':'Relative event period');
if(![...$('speed').options].some(o=>+o.value===speed)){const o=document.createElement('option');o.value=speed;o.textContent=speed+'×';$('speed').append(o);}$('speed').value=speed;
for(const o of D.origins){const el=document.createElement('option');el.value=o;el.textContent='Origin '+o;$('origin').append(el);}
for(const d of D.destinations){const label=document.createElement('label'),box=document.createElement('input'),dot=document.createElement('span');box.type='checkbox';box.checked=true;box.dataset.destination=d;dot.className='dot';dot.style.background=color(d);label.append(box,dot,document.createTextNode('Destination '+d));$('destinations').append(label);box.addEventListener('change',()=>{box.checked?selected.add(d):selected.delete(d);draw();});}
function theme(){document.documentElement.dataset.theme=$('theme').value==='auto'?(media.matches?'dark':'light'):$('theme').value;draw();}
function visibleOrigins(){return $('origin').value==='all'?D.origins:[+$('origin').value];}
function rebuild(){panels=[];$('charts').replaceChildren();const overlay=$('layout').value==='overlay';$('charts').classList.toggle('overlay',overlay);
for(const o of overlay?[null]:visibleOrigins()){const box=document.createElement('section'),title=document.createElement('h2'),canvas=document.createElement('canvas');box.className='panel';title.textContent=o==null?'Selected mover profiles':'Origin group '+o;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',title.textContent+'. Numeric values available by tapping or pointing at a marker.');box.append(title,canvas);$('charts').append(box);const ctx=canvas.getContext('2d');if(!ctx)throw Error('This preview does not provide a 2D canvas');const panel={o,canvas,ctx,points:[]};panels.push(panel);canvas.addEventListener('pointermove',e=>details(e,panel));canvas.addEventListener('pointerdown',e=>details(e,panel));}draw();}
function rows(){return D.rows.filter(r=>(timeMode?r[0]===frames[index]:r[0]===null)&&visibleOrigins().includes(r[1])&&selected.has(r[2]));}
const rangeRows=D.rows.filter(r=>timeMode?r[0]!==null:r[0]===null), values=rangeRows.flatMap(r=>[r[4],...(D.ci&&r[6]!=null?[r[6],r[7]]:[])]);
let low=values.reduce((a,b)=>Math.min(a,b),Infinity),high=values.reduce((a,b)=>Math.max(a,b),-Infinity);const pad=Math.max((high-low)*.12,.02);low-=pad;high+=pad;
// Always include exported confidence limits in the fixed axis when toggled.
const ciValues=rangeRows.flatMap(r=>r[6]==null?[]:[r[6],r[7]]),ciLow=ciValues.reduce((a,b)=>Math.min(a,b),low),ciHigh=ciValues.reduce((a,b)=>Math.max(a,b),high);
function draw(){if(!panels.length||failed)return;const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink'),muted=cs.getPropertyValue('--muted'),line=cs.getPropertyValue('--line');
const dark=document.documentElement.dataset.theme==='dark',current=rows(),origins=visibleOrigins(),overlay=$('layout').value==='overlay',showCI=$('ci').checked,min=showCI?ciLow:low,max=showCI?ciHigh:high;
let events=0,paths=0;const seen=new Set();for(const r of current){const key=r[1]+':'+r[2];if(!seen.has(key)){seen.add(key);events+=r[8];paths++;}}
text('counts',fmt(events)+' events · '+paths+' paths · '+fmt(D.N_events)+' pooled eligible events');
text('period',timeMode?'Arrival '+fmt(frames[index]):'Period '+frames[index]);$('timeline').value=index;$('play').textContent=paused?'Play':'Pause';
$('empty').hidden=!!current.length;$('empty').textContent='No profiles meet this selection and minimum cell size in this frame.';
for(const p of panels){const width=p.canvas.getBoundingClientRect().width||500,height=p.canvas.getBoundingClientRect().height||285,dpr=window.devicePixelRatio||1;p.canvas.width=Math.round(width*dpr);p.canvas.height=Math.round(height*dpr);const c=p.ctx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,width,height);p.points=[];
const L=64,R=20,T=16,B=48,W=width-L-R,H=height-T-B,x=t=>L+(t-D.pre)/(D.post-D.pre)*W,y=v=>T+(max-v)/(max-min)*H;
c.font='11px ui-monospace, monospace';c.lineWidth=1;c.setLineDash([]);
for(let i=0;i<5;i++){const value=min+(max-min)*i/4,yy=y(value);c.strokeStyle=line;c.beginPath();c.moveTo(L,yy);c.lineTo(width-R,yy);c.stroke();c.fillStyle=muted;c.textAlign='right';c.fillText(fmt(value),L-8,yy+4);}
const step=Math.max(1,Math.ceil((D.post-D.pre)/8));for(let t=D.pre;t<=D.post;t+=step){c.textAlign='center';c.fillStyle=muted;c.fillText(t,x(t),height-29);}c.fillText('Periods from move (0 = new job)',L+W/2,height-8);
c.save();c.translate(14,T+H/2);c.rotate(-Math.PI/2);c.fillText(D.ytitle,0,0);c.restore();
c.strokeStyle=muted;c.setLineDash([3,4]);c.beginPath();c.moveTo(x(-.5),T);c.lineTo(x(-.5),T+H);c.stroke();c.setLineDash([]);
if(!timeMode){c.strokeStyle=cs.getPropertyValue('--accent');c.globalAlpha=.2;c.lineWidth=9;c.beginPath();c.moveTo(x(frames[index]),T);c.lineTo(x(frames[index]),T+H);c.stroke();c.globalAlpha=1;}
for(const o of origins.filter(o=>p.o==null||p.o===o))for(const d of D.destinations.filter(d=>selected.has(d))){const a=current.filter(r=>r[1]===o&&r[2]===d).sort((a,b)=>a[3]-b[3]);if(!a.length)continue;c.strokeStyle=color(d);c.fillStyle=color(d);c.lineWidth=2;c.setLineDash(overlay?patterns[D.origins.indexOf(o)%patterns.length]:[]);c.beginPath();a.forEach((r,i)=>i?c.lineTo(x(r[3]),y(r[4])):c.moveTo(x(r[3]),y(r[4])));if(dark){c.save();c.strokeStyle=ink;c.globalAlpha=.28;c.lineWidth=4;c.stroke();c.restore();}c.stroke();c.setLineDash([]);
for(const r of a){const xx=x(r[3]),yy=y(r[4]);if(showCI&&r[6]!=null){c.globalAlpha=.4;c.lineWidth=1;c.beginPath();c.moveTo(xx,y(r[6]));c.lineTo(xx,y(r[7]));c.moveTo(xx-3,y(r[6]));c.lineTo(xx+3,y(r[6]));c.moveTo(xx-3,y(r[7]));c.lineTo(xx+3,y(r[7]));c.stroke();c.globalAlpha=1;}c.beginPath();c.arc(xx,yy,!timeMode&&r[3]===frames[index]?5:3,0,Math.PI*2);c.fill();if(dark){c.strokeStyle=ink;c.lineWidth=.8;c.stroke();c.strokeStyle=color(d);}p.points.push({x:xx,y:yy,r});}}
if(!p.points.length){c.fillStyle=muted;c.textAlign='center';c.fillText('No qualifying profiles in this panel',L+W/2,T+H/2);}}
$('legend').replaceChildren();$('legend').hidden=!D.legend;if(D.legend){for(const d of D.destinations.filter(d=>selected.has(d))){const el=document.createElement('span');const dot=document.createElement('span');dot.className='dot';dot.style.background=color(d);el.append(dot,document.createTextNode(' Destination '+d));$('legend').append(el);}if(overlay){const labels=['solid','dashed','dotted','dash-dot','long dash','short dash'];for(const o of origins){const el=document.createElement('span');el.textContent='Origin '+o+': '+labels[D.origins.indexOf(o)%6];$('legend').append(el);}}}
$('status').hidden=true;}
function details(e,p){const rect=p.canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let best=null,distance=18;for(const point of p.points){const d=Math.hypot(point.x-x,point.y-y);if(d<distance){best=point;distance=d;}}if(!best)return;const r=best.r;$('details').textContent='Origin '+r[1]+' → destination '+r[2]+' · event period '+r[3]+(r[0]===null?' · pooled':' · arrival '+fmt(r[0]))+'\nMean: '+fmt(r[4])+' · events: '+fmt(r[8])+' · workers: '+fmt(r[9])+' · '+D.cilevel+'% interval: '+(r[6]==null?'unavailable (one worker)':fmt(r[6])+' to '+fmt(r[7]));}
function move(n){index=(n+frames.length)%frames.length;elapsed=0;draw();}
$('play').addEventListener('click',()=>{paused=!paused;elapsed=0;draw();});$('prev').addEventListener('click',()=>{paused=true;move(index-1);});$('next').addEventListener('click',()=>{paused=true;move(index+1);});$('restart').addEventListener('click',()=>move(0));$('timeline').addEventListener('input',()=>{paused=true;move(+$('timeline').value);});$('speed').addEventListener('change',()=>{speed=+$('speed').value;elapsed=0;});$('theme').addEventListener('change',theme);media.addEventListener('change',theme);$('origin').addEventListener('change',rebuild);$('layout').addEventListener('change',rebuild);$('ci').addEventListener('change',draw);
$('reset').addEventListener('click',()=>{$('origin').value='all';$('layout').value=D.overlay?'overlay':'panels';$('ci').checked=!!D.ci;selected=new Set(D.destinations);for(const b of $('destinations').querySelectorAll('input'))b.checked=true;rebuild();});window.addEventListener('resize',draw);
function tick(now){if(failed)return;if(last!==null&&!paused&&!document.hidden){elapsed+=Math.min(now-last,100);if(elapsed>=1300/speed)move(index+1);}last=now;requestAnimationFrame(tick);}
rebuild();theme();requestAnimationFrame(tick);
} catch(e){error(e);}
})();
</script></body></html>

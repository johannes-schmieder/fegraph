<body>
<main>
<header><div><div class="eyebrow">FEGRAPH · LINKED WORKER–FIRM DATA</div><h1 id="title"></h1><p id="subtitle"></p></div><div class="tools"><label for="theme" class="sr">Color theme</label><select id="theme"><option value="auto">System theme</option><option value="light">Light</option><option value="dark">Dark</option></select><button id="reset">Reset view</button></div></header>
<div class="meta"><span id="mode"></span><span id="counts"></span></div>
<div class="stage"><div class="plot"><canvas id="graph" tabindex="0" role="img" aria-label="Animated graph; details and counts available beside the plot"></canvas><div id="tooltip" hidden></div></div><aside id="details" aria-label="Graph details"></aside></div>
<div class="transport"><button id="play" class="primary">Pause</button><button id="restart">Restart</button><button id="prev" aria-label="Previous period">←</button><input id="timeline" aria-label="Data period" type="range" min="0" step="1" value="0"><button id="next" aria-label="Next period">→</button><span id="period" aria-live="polite"></span><label>Speed <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div>
<div id="status"></div><div id="legend"></div><p id="note"></p><div id="provenance"></div>

</main>

<script>
(() => {
'use strict';
const D=JSON.parse(document.getElementById('fegraph-data').textContent);
const $=id=>document.getElementById(id), canvas=$('graph'),ctx=canvas.getContext('2d');
const fmt=x=>x==null?'missing':Number(x).toLocaleString(undefined,{maximumFractionDigits:4});
const num=x=>Number.isFinite(x)?x:0, rgb=c=>'rgb('+c.trim().split(/\s+/).join(',')+')';

let paused=reduced, index=0, phase=0, elapsed=0, last=null, speed=+D.speed, W=800,H=520,zoom=1,panX=0,panY=0,hover=null,drag=null,screenNodes=[],screenEdges=[],heatCells=[],colors={};
const text=(id,t)=>{$(id).textContent=t;$(id).hidden=!t;};
text('title',D.title);text('subtitle',D.subtitle);text('note',D.note);document.title=(D.title||'fegraph')+' · animation';
text('mode',D.mode==='time'?(D.edge==='shared'&&D.type!=='bipartite'?'Connections observed through each period':'Observed periods'):'Aggregate graph · illustrative motion');
text('provenance',D.command?`Stata export · fegraph ${D.version} · ${D.type} · ${D.statistic}${D.net?' · net':''}\nAll graph values were calculated in Stata. Playback runs locally in this file.`:'');
$('theme').value=D.theme;
function theme(){let t=$('theme').value;document.documentElement.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;const cs=getComputedStyle(document.documentElement);for(const k of ['ink','muted','line','accent','surface','neutral']) colors[k]=cs.getPropertyValue('--'+k).trim();draw();}
$('theme').addEventListener('change',theme);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
$('timeline').max=D.frames.length-1;for(const id of ['timeline','prev','next'])$(id).hidden=D.mode!=='time';
if(![...$('speed').options].some(o=>+o.value===speed))$('speed').add(new Option(speed+'×',String(speed)));
$('speed').value=String(speed);$('speed').addEventListener('change',()=>speed=+$('speed').value);

$('play').addEventListener('click',()=>{paused=!paused;playState();});
function seek(k){index=Math.max(0,Math.min(D.frames.length-1,k));elapsed=0;phase=0;hover=null;update();draw();}
$('restart').addEventListener('click',()=>seek(0));$('prev').addEventListener('click',()=>{paused=true;playState();seek(index-1);});$('next').addEventListener('click',()=>{paused=true;playState();seek(index+1);});$('timeline').addEventListener('input',()=>{paused=true;playState();seek(+$('timeline').value);});

function row(label,value){const r=document.createElement('div');r.className='row';const a=document.createElement('span'),b=document.createElement('b');a.textContent=label;b.textContent=value;r.append(a,b);$('details').append(r);}
function details(){const f=D.frames[index];$('details').replaceChildren();const h=document.createElement('h2');h.textContent=hover?.kind==='node'?D.nodes[hover.i].label:hover?'Flow details':'Selected graph';$('details').append(h);
if(hover?.kind==='node'){const n=D.nodes[hover.i];row('ID',n.id);row('Kind',['Firm / bin','Worker','Nonemployment'][n.v[0]]);row('Size',fmt(f.sizes[hover.i]));row('Color value',fmt(n.v[2]));row('Ordering score',fmt(n.v[3]));row('Level',fmt(n.v[4]));}
else if(hover){const e=hover.kind==='cell'?hover.e:D.edges[hover.i],v=hover.kind==='cell'?hover.v:f.values[hover.i];row('Origin',D.nodes[e.from].label);row('Destination',D.nodes[e.to].label);row('Gross',fmt(v[0]));row('Reverse gross',fmt(v[1]));row('Net',fmt(v[2]));row(D.statistic,fmt(v[3]));if(D.edgecolor!=='none')row('Edge color value',fmt(v[4]));}
else {row('Nodes',D.nodes.length);row('Selected links',D.edges.length);row('All gross mass',fmt(f.coverage[0]));row('Shown gross mass',fmt(f.coverage[1]));row('Boundary gross mass',fmt(f.coverage[2]));row('Within-node mass',fmt(f.coverage[3]));const p=document.createElement('p');p.className='hint';p.textContent=D.mode==='time'?'The graph selection is fixed over the selected history. A link can be inactive in the current period.':'Motion repeats the same aggregate values. It does not reconstruct a sequence of observed moves.';$('details').append(p);}}

function legendGroup(label,colors,lo,hi,categories){const g=document.createElement('div');g.className='legendgroup';const title=document.createElement('strong');title.textContent=label;g.append(title);colors.forEach((c,i)=>{const k=document.createElement('span');k.className='key';const sw=document.createElement('i');sw.className='swatch';sw.style.background=c;k.append(sw,document.createTextNode(categories?.length?categories[i]||'':`${fmt(lo+i*(hi-lo)/7)}–${fmt(lo+(i+1)*(hi-lo)/7)}`));g.append(k);});$('legend').append(g);}
if(D.legend){if(D.scales[3]!=null)legendGroup(D.type==='heatmap'?'Cell value':'Firm color',pal,D.scales[3],D.scales[4],D.categories);if(D.type!=='heatmap'&&D.scales[5]!=null)legendGroup('Worker color',pal,D.scales[5],D.scales[6]);if(D.edgecolor!=='none')legendGroup('Edge '+D.edgecolor,epal,-D.scales[2],D.scales[2]);const h=document.createElement('span');h.textContent=D.type==='heatmap'?'Neutral = zero / hidden':'Gray = missing color · size and width use four fixed classes';$('legend').append(h);}else $('legend').hidden=true;
const allPoints=[...D.nodes.map(n=>[n.v[5],n.v[6]]),...D.edges.flatMap(e=>e.path)].filter(p=>p.every(Number.isFinite));
const bounds=[Infinity,-Infinity,Infinity,-Infinity];for(const [x,y] of allPoints){bounds[0]=Math.min(bounds[0],x);bounds[1]=Math.max(bounds[1],x);bounds[2]=Math.min(bounds[2],y);bounds[3]=Math.max(bounds[3],y);}if(bounds[0]===bounds[1]){bounds[0]-=.5;bounds[1]+=.5;}if(bounds[2]===bounds[3]){bounds[2]-=.5;bounds[3]+=.5;}

function line(p,color,width,alpha=1){if(!p.length)return;ctx.beginPath();ctx.moveTo(...p[0]);for(let k=1;k<p.length;k++)ctx.lineTo(...p[k]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.globalAlpha=alpha;ctx.stroke();ctx.globalAlpha=1;}
function axes(){if(D.type!=='ladder')return;ctx.strokeStyle=colors.line;ctx.fillStyle=colors.muted;ctx.font='10px ui-monospace,monospace';ctx.textAlign='center';for(let k=0;k<=4;k++){const x=k*25;const p=project([x,bounds[2]]);ctx.fillText(String(x),p[0],H-28);}ctx.fillText('Firm percentile: low to high',W/2,H-9);const firms=D.nodes.filter(n=>n.v[0]===0);let lo=Infinity,hi=-Infinity;for(const n of firms){lo=Math.min(lo,n.v[6]);hi=Math.max(hi,n.v[6]);}ctx.textAlign='right';for(let k=0;k<=4;k++){if(hi===lo&&k>0)continue;let y=lo+(hi-lo)*k/4;let p=project([bounds[0],y]);ctx.fillText(fmt(y),54,p[1]+3);}ctx.save();ctx.translate(13,H/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('Supplied level',0,0);ctx.restore();const outside=D.nodes.find(n=>n.v[0]===2);if(outside){const y=project([0,(outside.v[6]+lo)/2])[1];ctx.setLineDash([4,4]);line([[60,y],[W-30,y]],colors.line,1);ctx.setLineDash([]);}}
function heatmap(){const f=D.frames[index],n=D.nodes.length,left=115,top=25,side=Math.max(80,Math.min(W-left-24,H-125)),cell=side/n;const cells=new Map();D.edges.forEach((e,i)=>{cells.set(e.from+','+e.to,{e,v:f.values[i]});if(D.net&&!cells.has(e.to+','+e.from)){const v=f.values[i];cells.set(e.to+','+e.from,{e:{from:e.to,to:e.from},v:[v[1],v[0],-v[2],-v[3],v[4]==null?null:-v[4],v[5],v[6]]});}});heatCells=[];for(let a=0;a<n;a++)for(let b=0;b<n;b++){const d=cells.get(a+','+b)||{e:{from:a,to:b},v:[0,0,0,0,null,0,0]},value=d.v[3],c=value===0?0:colorClass(value,D.scales[3],D.scales[4]);ctx.fillStyle=c?pal[c-1]:colors.neutral;ctx.globalAlpha=D.mode==='aggregate'?(paused?1:.7+.3*Math.sin(phase*2-a*.13-b*.17)**2):1;ctx.fillRect(left+b*cell,top+(n-1-a)*cell,Math.max(1,cell-1),Math.max(1,cell-1));heatCells.push({...d,x:left+b*cell,y:top+(n-1-a)*cell,size:cell});}ctx.globalAlpha=1;ctx.fillStyle=colors.muted;ctx.font='10px ui-monospace,monospace';const skip=Math.max(1,Math.ceil(n/20));D.nodes.forEach((node,i)=>{if(i%skip)return;ctx.textAlign='right';ctx.fillText(node.label.slice(0,16),left-8,top+(n-i-.5)*cell+3);ctx.save();ctx.translate(left+(i+.5)*cell,top+side+10);ctx.rotate(-Math.PI/4);ctx.textAlign='right';ctx.fillText(node.label.slice(0,16),0,0);ctx.restore();});ctx.textAlign='center';ctx.fillText('Destination',left+side/2,H-7);ctx.save();ctx.translate(14,top+side/2);ctx.rotate(-Math.PI/2);ctx.fillText('Origin',0,0);ctx.restore();}
function radius(i){const n=D.nodes[i];return Math.max(1.5,n.v[0]===1?2.5*D.nodescale:(3+2.8*cls(D.frames[index].sizes[i],D.scales[0]))*D.nodescale);}
function clipEnd(points,center,r){let k=1;while(k<points.length&&Math.hypot(points[k][0]-center[0],points[k][1]-center[1])<r)k++;if(k>=points.length)return [];const a=points[k-1],b=points[k];let lo=0,hi=1;for(let j=0;j<18;j++){const t=(lo+hi)/2,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;if(Math.hypot(x-center[0],y-center[1])<r)lo=t;else hi=t;}const t=(lo+hi)/2;return [[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],...points.slice(k)];}

D.nodes.forEach((n,i)=>{const p=project([n.v[5],n.v[6]]),kind=n.v[0],size=f.sizes[i],r=kind===1?2.5*D.nodescale:(3+2.8*cls(size,D.scales[0]))*D.nodescale,c=n.v[7]?pal[n.v[7]-1]:colors.muted;circle(p,Math.max(1.5,r)+1,colors.surface);circle(p,Math.max(1.5,r),c,size>0?1:.25,kind===2);if(hover?.kind==='node'&&hover.i===i){ctx.beginPath();ctx.arc(...p,r+5,0,Math.PI*2);ctx.strokeStyle=colors.accent;ctx.lineWidth=1;ctx.stroke();}screenNodes.push({i,p,r:Math.max(6,r)});if(n.displaylabel){ctx.font='10px ui-monospace,monospace';ctx.fillStyle=colors.muted;ctx.textAlign='center';ctx.fillText(n.displaylabel.slice(0,45),p[0],p[1]+(kind===1||kind===2?r+13:-r-7));}});}

canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(drag){panX+=e.clientX-drag[0];panY+=e.clientY-drag[1];drag=[e.clientX,e.clientY];draw();return;}hover=hit(x,y);details();$('tooltip').hidden=!hover;if(hover){$('tooltip').textContent=hover.kind==='node'?D.nodes[hover.i].label:(D.nodes[(hover.e||D.edges[hover.i]).from].label+' → '+D.nodes[(hover.e||D.edges[hover.i]).to].label+'\n'+D.statistic+': '+fmt((hover.v||D.frames[index].values[hover.i])[3]));$('tooltip').style.left=Math.max(0,Math.min(W-280,x+12))+'px';$('tooltip').style.top=Math.min(H-70,y+12)+'px';}draw();});canvas.addEventListener('pointerleave',()=>{if(!drag){hover=null;$('tooltip').hidden=true;details();draw();}});canvas.addEventListener('pointerdown',e=>{if(D.type==='heatmap')return;drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{if(D.type==='heatmap')return;e.preventDefault();zoom=Math.max(.5,Math.min(5,zoom*Math.exp(-e.deltaY*.001)));draw();},{passive:false});
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;const dpr=window.devicePixelRatio||1;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}new ResizeObserver(resize).observe(canvas.parentElement);
function tick(now){const dt=last==null?0:Math.min(.1,(now-last)/1000);last=now;if(!paused&&!document.hidden){phase+=dt*speed;if(D.mode==='time'&&D.frames.length>1){elapsed+=dt*speed;if(elapsed>=1.8){index=(index+1)%D.frames.length;elapsed=0;hover=null;update();}}draw();}requestAnimationFrame(tick);}theme();update();playState();resize();requestAnimationFrame(tick);
})();
</script>
